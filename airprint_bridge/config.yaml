name: Epson AirPrint Bridge
version: "1.2.2"
slug: airprint_bridge
description: (Beta) Turn almost any printer (network or USB) into an AirPrint printer for iPhones, iPads and Macs, with status sensors.
url: https://github.com/rostyslav-khomyk/ha-airprint-bridge
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
host_dbus: false
homeassistant_api: false
usb: false
options:
  mode: bridge
  printer_name: "Epson ET-2500 (HA)"
  printer_uri: ""
  printer_location: ""
  driver_url: ""
  driver_packages: []
  driver_match: "ET-2500"
  paper_sizes: "A4"
  color: true
  duplex: false
  status_sensors: false
  airprint_port: 8631
  debug_logging: false
schema:
  mode: list(auto|bridge|sensors)?
  printer_name: str?
  printer_uri: str?
  printer_location: str?
  driver_url: str?
  driver_packages:
    - str
  driver_match: str?
  paper_sizes: str?
  color: bool?
  duplex: bool?
  status_sensors: bool?
  airprint_port: port?
  debug_logging: bool?
